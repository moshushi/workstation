---
- name: Install and configure ddgr
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Ensure ddgr is installed via pacman
      community.general.pacman:
        name: ddgr
        state: present
        update_cache: false

    - name: Create shell alias for ddgr
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: "alias ddgr='ddgr --unsafe'"
        create: true
        mode: '0644'
      loop:
        - ~/.bashrc
        - ~/.zshrc
      become: false

